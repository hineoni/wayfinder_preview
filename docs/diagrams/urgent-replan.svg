<rect x="28" y="310" width="984" height="72" rx="12" fill="#f3efff" stroke="none" stroke-width="1.5"/>
<text x="48" y="341" font-size="23" fill="#7552b3" font-weight="700" text-anchor="start">Визит клиента: 14:30 → 15:50</text>
<text x="48" y="368" font-size="20" fill="#526079" font-weight="400" text-anchor="start">Сдвиг на 80 минут. Свободная бригада без комплекта не может принять аварию.</text>
