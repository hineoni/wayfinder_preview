<text x="412.0" y="118" font-size="18" fill="#526079" font-weight="400" text-anchor="middle">13:30</text>
<line x1="412.0" y1="128" x2="412.0" y2="288" stroke="#e2e7ee" stroke-width="1.5"/>
<text x="508.0" y="118" font-size="18" fill="#526079" font-weight="400" text-anchor="middle">14:00</text>
<line x1="508.0" y1="128" x2="508.0" y2="288" stroke="#e2e7ee" stroke-width="1.5"/>
<text x="604.0" y="118" font-size="18" fill="#526079" font-weight="400" text-anchor="middle">14:30</text>
<line x1="604.0" y1="128" x2="604.0" y2="288" stroke="#e2e7ee" stroke-width="1.5"/>
<text x="700.0" y="118" font-size="18" fill="#526079" font-weight="400" text-anchor="middle">15:00</text>
<line x1="700.0" y1="128" x2="700.0" y2="288" stroke="#e2e7ee" stroke-width="1.5"/>
<text x="796.0" y="118" font-size="18" fill="#526079" font-weight="400" text-anchor="middle">15:30</text>
<line x1="796.0" y1="128" x2="796.0" y2="288" stroke="#e2e7ee" stroke-width="1.5"/>
<text x="892.0" y="118" font-size="18" fill="#526079" font-weight="400" text-anchor="middle">16:00</text>
<line x1="892.0" y1="128" x2="892.0" y2="288" stroke="#e2e7ee" stroke-width="1.5"/>
<text x="988.0" y="118" font-size="18" fill="#526079" font-weight="400" text-anchor="middle">16:30</text>
<line x1="988.0" y1="128" x2="988.0" y2="288" stroke="#e2e7ee" stroke-width="1.5"/>
