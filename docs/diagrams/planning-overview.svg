<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-labelledby="title desc">
<title id="title">От исходных данных к плану дня</title><desc id="desc">Заявки, бригады и переезды используются для базового и улучшенного планов. Диспетчер сравнивает результаты и изучает карту, расписание и объяснения.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a97ab"/></marker></defs>
<rect width="1040" height="470" rx="18" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172033">
<text x="28" y="40" font-size="18" fill="#526079" font-weight="700" text-anchor="start">01</text>
<text x="28" y="70" font-size="22" fill="#172033" font-weight="700" text-anchor="start">Данные дня</text>
<text x="370" y="40" font-size="18" fill="#526079" font-weight="700" text-anchor="start">02</text>
<text x="370" y="70" font-size="22" fill="#172033" font-weight="700" text-anchor="start">Два варианта плана</text>
<text x="714" y="40" font-size="18" fill="#526079" font-weight="700" text-anchor="start">03</text>
<text x="714" y="70" font-size="22" fill="#172033" font-weight="700" text-anchor="start">Результат для диспетчера</text>
<rect x="28" y="94" width="290" height="104" rx="12" fill="#eff6ff" stroke="#2d62b6" stroke-width="1.5"/>
<text x="48" y="128" font-size="22" fill="#2d62b6" font-weight="700" text-anchor="start">Заявки</text>
<text x="48" y="160" font-size="20" fill="#526079" font-weight="400" text-anchor="start">Адрес, тип работы,</text>
<text x="48" y="188" font-size="20" fill="#526079" font-weight="400" text-anchor="start">окно визита</text>
<rect x="28" y="212" width="290" height="104" rx="12" fill="#eff6ff" stroke="#2d62b6" stroke-width="1.5"/>
<text x="48" y="246" font-size="22" fill="#2d62b6" font-weight="700" text-anchor="start">Бригады</text>
<text x="48" y="278" font-size="20" fill="#526079" font-weight="400" text-anchor="start">Навыки, транспорт,</text>
<text x="48" y="306" font-size="20" fill="#526079" font-weight="400" text-anchor="start">смена и оборудование</text>
<rect x="28" y="330" width="290" height="104" rx="12" fill="#eff6ff" stroke="#2d62b6" stroke-width="1.5"/>
<text x="48" y="364" font-size="22" fill="#2d62b6" font-weight="700" text-anchor="start">Переезды</text>
<text x="48" y="396" font-size="20" fill="#526079" font-weight="400" text-anchor="start">Готовые матрицы</text>
<text x="48" y="424" font-size="20" fill="#526079" font-weight="400" text-anchor="start">времени и расстояний</text>
<line x1="336" y1="146" x2="336" y2="382" stroke="#8a97ab" stroke-width="1.5"/>
<line x1="318" y1="146" x2="336" y2="146" stroke="#8a97ab" stroke-width="1.5"/>
<line x1="318" y1="264" x2="336" y2="264" stroke="#8a97ab" stroke-width="1.5"/>
<line x1="318" y1="382" x2="336" y2="382" stroke="#8a97ab" stroke-width="1.5"/>
<path d="M 336 264 L 350 264 L 350 162 L 370 162" fill="none" stroke="#8a97ab" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 350 264 L 350 322 L 370 322" fill="none" stroke="#8a97ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="370" y="94" width="290" height="136" rx="12" fill="#f3f5f8" stroke="#67768b" stroke-width="1.5"/>
<text x="390" y="128" font-size="22" fill="#67768b" font-weight="700" text-anchor="start">Базовый</text>
<text x="390" y="160" font-size="20" fill="#526079" font-weight="400" text-anchor="start">Заявки по порядку.</text>
<text x="390" y="188" font-size="20" fill="#526079" font-weight="400" text-anchor="start">Первый подходящий</text>
<text x="390" y="216" font-size="20" fill="#526079" font-weight="400" text-anchor="start">исполнитель.</text>
<rect x="370" y="254" width="290" height="136" rx="12" fill="#f3efff" stroke="#7552b3" stroke-width="1.5"/>
<text x="390" y="288" font-size="22" fill="#7552b3" font-weight="700" text-anchor="start">Улучшенный</text>
<text x="390" y="320" font-size="20" fill="#526079" font-weight="400" text-anchor="start">Поиск распределения:</text>
<text x="390" y="348" font-size="20" fill="#526079" font-weight="400" text-anchor="start">приоритеты заявок,</text>
<text x="390" y="376" font-size="20" fill="#526079" font-weight="400" text-anchor="start">бригады и пробег.</text>
<path d="M 660 162 L 684 162 L 684 214 L 714 214" fill="none" stroke="#8a97ab" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 660 322 L 684 322 L 684 214" fill="none" stroke="#8a97ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="714" y="94" width="298" height="170" rx="12" fill="#edf8f1" stroke="#29804f" stroke-width="1.5"/>
<text x="734" y="128" font-size="22" fill="#29804f" font-weight="700" text-anchor="start">Сравнение</text>
<text x="734" y="160" font-size="20" fill="#526079" font-weight="400" text-anchor="start">Охват заявок</text>
<text x="734" y="188" font-size="20" fill="#526079" font-weight="400" text-anchor="start">Задействованные бригады</text>
<text x="734" y="216" font-size="20" fill="#526079" font-weight="400" text-anchor="start">Общий пробег</text>
<text x="734" y="244" font-size="20" fill="#526079" font-weight="400" text-anchor="start">Пробег каждой бригады</text>
<path d="M 864 264 L 864 292" fill="none" stroke="#8a97ab" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="714" y="294" width="298" height="140" rx="12" fill="#edf8f1" stroke="#29804f" stroke-width="1.5"/>
<text x="734" y="328" font-size="22" fill="#29804f" font-weight="700" text-anchor="start">Просмотр плана</text>
<text x="734" y="360" font-size="20" fill="#526079" font-weight="400" text-anchor="start">Карта — куда ехать</text>
<text x="734" y="388" font-size="20" fill="#526079" font-weight="400" text-anchor="start">Расписание — когда</text>
<text x="734" y="416" font-size="20" fill="#526079" font-weight="400" text-anchor="start">Карточка — почему</text>
</g>
</svg>
