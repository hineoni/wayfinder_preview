<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="410" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
<title id="title">Авария меняет будущий визит</title><desc id="desc">До события работа идёт с 12:30 до 14:10, клиентский визит с 14:30 до 15:00. После аварии: прежняя работа сохраняется, авария занимает 14:10–15:50, клиентский визит переносится на 15:50–16:20.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a97ab"/></marker></defs>
<rect width="1040" height="410" rx="18" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#172033">
<text x="28" y="40" font-size="26" fill="#172033" font-weight="700" text-anchor="start">Авария в 13:30: что меняется в расписании</text>
<text x="28" y="73" font-size="21" fill="#526079" font-weight="400" text-anchor="start">Бригада с комплектом. Все работы — в одном здании.</text>
<text x="220.0" y="118" font-size="18" fill="#526079" font-weight="400" text-anchor="middle">12:30</text>
